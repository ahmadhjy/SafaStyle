upstream safastyle_app {
    server unix:/run/gunicorn/safastyle.sock fail_timeout=0;
}

# HTTP → HTTPS (Certbot may replace this block on the server)
server {
    listen 80;
    server_name safastyle.com www.safastyle.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name safastyle.com www.safastyle.com;

    client_max_body_size 20M;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    location /static/ {
        alias /var/www/safastyle/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        gzip_static on;
    }

    location /media/ {
        alias /var/www/safastyle/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://safastyle_app;
    }
}
